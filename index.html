<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estación</title>
  <link rel="stylesheet" href="style.css?v=20261018-nav1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Estación</h1>
      <p>Resumen semanal</p>
      <p id="app-message" role="status" aria-live="polite"></p>
      <p id="logo-storage-status" role="status" aria-live="polite" style="font-size:12px;margin:4px 0;">Comprobando almacenamiento…</p>
    </header>
    <section class="summary">
      <button id="toggle-figures" class="toggle-figures" type="button" aria-label="Ocultar cifras" aria-pressed="false" title="Ocultar o mostrar cifras"><svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle><path class="eye-slash" d="M4 4 20 20"></path></svg></button>
      <div class="card monthly-card"><span>Ganancia mensual registrada</span><h2 id="ganancia-mensual">$0</h2><small id="mes-ganancia"></small></div>
      <div class="card"><span>Total negocios</span><h2 id="total-negocios">0</h2></div>
      <div class="card"><span>Cobro semanal</span><h2 id="total-semanal">$0</h2></div>
      <div class="card"><span>Cobrado</span><h2 id="total-cobrado">$0</h2></div>
      <div class="card"><span>Pendiente</span><h2 id="total-pendiente">$0</h2></div>
      
    </section>
    <section class="payments">
      <div class="section-title">
        <h3>Cobros de esta semana</h3>
        <button id="add-business">+ Agregar</button>
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="pending">Pendientes</button>
        <button class="filter-btn" data-filter="paid">Cobrados</button>
      </div>
      <div class="bulk-actions">
        <button id="mark-all-paid" type="button">Marcar todo como Cobrado</button>
        <button id="mark-all-pending" type="button">Marcar todo como Pendiente</button>
      </div>
      <input type="text" id="search-business" placeholder="Buscar negocio...">
      <div class="payment-card" data-monto="350">
        <img src="img/La Furia.jpeg">
        <div class="info"><h4>Furia</h4><p>Domingo • $350</p></div>
        <div class="actions">
          <span class="status paid">Cobrado</span>
          <button class="edit-btn">✎</button>
          <button class="delete-btn">✕</button>
        </div>
      </div>
    </section>
    <div class="modal" id="business-modal">
      <div class="modal-content">
        <h3>Nuevo negocio</h3>
        <input type="text" id="business-name" placeholder="Nombre del negocio">
        <input type="number" id="business-amount" placeholder="Monto semanal">
        <select id="business-day">
          <option value="">Día de cobro</option>
          <option>Lunes</option><option>Martes</option><option>Miércoles</option>
          <option>Jueves</option><option>Viernes</option><option>Sábado</option><option>Domingo</option>
        </select>
        <input type="file" id="business-image" accept="image/*">
        <button id="save-business">Guardar</button>
        <button id="cancel-business" class="cancel-btn">Cancelar</button>
      </div>
    </div>
    <section class="history-view" id="history-view" style="display:none;">
      <div class="section-title">
        <h3>Historial semanal</h3>
        <div class="history-actions">
          <button id="clear-history" type="button">Borrar historial</button>
          <button id="back-home">Volver</button>
        </div>
      </div>
      <div id="history-list"></div>
    </section>
    <nav class="bottom-nav">
      <button id="nav-inicio" type="button" aria-current="page">Inicio</button>
      <button id="nav-cobros" type="button">Cobros</button>
      <button id="nav-negocios" type="button">Negocios</button>
      <button id="save-history" type="button" aria-label="Abrir historial">Historial</button>
    </nav>
    <footer class="data-transfer" aria-label="Herramientas de almacenamiento">
      <button id="clear-cache" type="button">Borrar caché</button>
      <button id="export-data" type="button">Exportar respaldo</button>
      <button id="import-data" type="button">Importar respaldo</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </footer>
  </div>
  <script src="app.js?v=20261019-logos2"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
